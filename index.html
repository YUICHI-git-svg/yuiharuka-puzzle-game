<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>ゆいとはるかのパズルゲーム</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14122b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="パズルゲーム">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root{
    color-scheme: dark;
    --bg:#14122b; --bg2:#1d1a3d; --panel:#232048; --panel2:#2b2760;
    --ink:#f4f2ff; --sub:#b9b4e6; --line:#3d3880;
    --fire:#ff5a4e; --water:#3fa9f5; --forest:#3ecf6e; --heal:#ff7eb0;
    --gold:#ffd34d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:radial-gradient(130% 55% at 50% 0%, #2c2563 0%, var(--bg) 62%) fixed, var(--bg);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;}
  button{font-family:inherit; min-height:2.25rem; cursor:pointer;}
  .hidden{display:none !important;}

  /* ---------- 共通 ---------- */
  .topbar{display:flex;align-items:center;gap:.5rem;padding:max(.55rem, env(safe-area-inset-top)) .8rem .55rem;}
  .icon-btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:999px;padding:.35rem .8rem;font-size:.85rem;font-weight:700;}
  .icon-btn.on{background:var(--gold);color:#3a2c00;border-color:var(--gold);}
  h1{font-size:1.25rem;margin:.2rem 0 .4rem;text-align:center;letter-spacing:.02em;}
  .wrap{max-width:560px;margin:0 auto;padding:0 .8rem 1.2rem;}

  /* ステージ */
  .sec-title{font-size:.95rem;font-weight:800;color:var(--sub);margin:.9rem 0 .45rem;}
  .stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;}
  .stage-btn{position:relative;min-width:0;border-radius:14px;border:2px solid var(--line);background:var(--panel);
    color:var(--ink);padding:.5rem .05rem .45rem;font-weight:800;font-size:.9rem;line-height:1.25;overflow:visible;}
  .stage-btn small{display:block;font-size:.58rem;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stage-btn.boss{border-color:#ff8a5c;}
  .stage-btn.cleared{border-color:var(--forest);}
  .stage-btn.locked{opacity:.38;}
  .stage-btn .crown{position:absolute;top:-7px;right:-2px;font-size:.68rem;color:var(--gold);}

  /* キャラカード（編成・ずかん） */
  .char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;}
  .char-card{background:var(--panel);border:2px solid var(--line);border-radius:16px;
    padding:.45rem .3rem .55rem;text-align:center;color:var(--ink);}
  .char-card.inparty{border-color:var(--gold);}
  .char-card.notowned{opacity:.45;}
  .char-card .art{height:74px;display:flex;align-items:flex-end;justify-content:center;}
  .char-card .art svg{height:74px;width:auto;max-width:100%;}
  .char-card .nm{font-size:.8rem;font-weight:800;margin-top:.2rem;line-height:1.2;}
  .char-card .sk{font-size:.62rem;color:var(--sub);line-height:1.35;margin-top:.25rem;text-align:left;padding:0 .2rem;}
  .char-card .sk b{color:var(--gold);font-weight:800;}
  .tag{display:inline-block;font-size:.6rem;font-weight:800;border-radius:999px;padding:.08rem .45rem;color:#fff;}
  .tag.fire{background:var(--fire);} .tag.water{background:var(--water);}
  .tag.forest{background:var(--forest);} .tag.heal{background:var(--heal);}
  .stars{font-size:.82rem;letter-spacing:.12em;line-height:1.2;}
  .stars .on{color:var(--gold);text-shadow:0 0 5px rgba(255,211,77,.55);}
  .stars .off{color:#57538a;}
  .rank-title{font-size:1rem;font-weight:900;color:var(--gold);margin:1rem 0 .45rem;letter-spacing:.06em;}
  .rank-title:first-child{margin-top:.2rem;}
  .msg{min-height:1.4em;text-align:center;font-size:.85rem;font-weight:700;color:var(--gold);margin:.5rem 0 0;}
  .hint{font-size:.75rem;color:var(--sub);text-align:center;margin:.5rem 0 0;line-height:1.55;}

  /* ---------- バトル ---------- */
  /* dvh非対応の古いiPhone（iPhone 7など）でも崩れないよう、
     vhを先に書いてフォールバックにし、対応端末ではdvhで上書きする */
  #battle{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#0d0b22;}
  /* ステージごとの壮大な背景（神殿・荒野・宇宙など）を全面に敷く */
  #bgLayer{position:absolute;inset:0;z-index:0;overflow:hidden;}
  #bgLayer img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;display:block;}
  /* 背景イラストの上に薄い暗幕＋上下グラデーションを重ねて、
     敵キャラ・HPバー・盤面の読みやすさを保つ */
  #bgLayer::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,8,28,.34) 0%,rgba(10,8,28,.10) 30%,rgba(10,8,28,.16) 58%,rgba(10,8,28,.55) 100%);}
  #battle>*:not(#bgLayer){position:relative;z-index:1;}
  .b-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:10;padding:max(.35rem, env(safe-area-inset-top)) .6rem 0;}
  .b-top .ttl{font-size:.8rem;color:var(--sub);font-weight:800;}
  .enemy-zone{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-start;width:100%;}
  /* 敵エリアは画面高の約19%に固定し、上限・下限も付ける。
     vh→dvhの順に書くことで dvh 非対応端末でも高さが auto に
     ならず、敵画像が原寸（1000px超）で広がる事故を防ぐ。
     overflowは #enemyArt 側だけにかけ、攻撃エフェクトははみ出して見せる */
  .enemy-stage{position:relative;flex:0 0 auto;height:19vh;height:19dvh;min-height:84px;max-height:168px;width:100%;display:flex;align-items:flex-end;justify-content:center;}
  .enemy-stage svg{height:100%;max-height:100%;width:auto;max-width:56vw;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));}
  .enemy-stage svg.boss{max-width:68vw;}
  #enemyArt{height:100%;max-height:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
  /* 画像側にも画面基準の上限を直接かける（二重ガード）：
     親の高さが何らかの理由で決まらなくても画面いっぱいにはならない */
  #enemyArt img{display:block;height:100%;max-height:19vh;max-height:19dvh;width:auto;max-width:56vw;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));}
  #enemyArt img.boss{max-width:68vw;}
  #enemyArt svg{display:block;height:100%;max-height:19vh;max-height:19dvh;width:auto;max-width:56vw;}
  .char-card .art img{height:74px;width:auto;max-width:100%;object-fit:contain;}
  .member .art img{height:56px;width:auto;max-width:100%;object-fit:contain;}
  .sheet .art img{height:110px;width:auto;max-width:100%;object-fit:contain;}
  .atk-badge{position:absolute;right:.55rem;top:38%;transform:translateY(-50%);
    background:var(--panel2);border:2px solid var(--line);border-radius:14px;
    padding:.4rem .5rem;text-align:center;font-size:.68rem;font-weight:800;color:var(--sub);line-height:1.3;min-width:74px;}
  .atk-badge .num{display:block;font-size:1.35rem;color:var(--ink);line-height:1.1;}
  .atk-badge.danger{border-color:var(--fire);background:#4a1f2e;}
  .atk-badge.danger .num{color:#ff8d84;}
  .enemy-meta{padding:0 .8rem;}
  .enemy-name{display:flex;align-items:center;justify-content:center;gap:.5rem;font-weight:800;font-size:1.05rem;margin:.1rem 0 .3rem;text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);}
  .hp-row{display:flex;align-items:center;gap:.55rem;}
  .hp-bar{flex:1;height:14px;border-radius:999px;background:#0d0b22;border:1px solid var(--line);overflow:hidden;}
  .hp-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ff7a52,#ffb35c);transition:width .45s ease;}
  .hp-num{font-size:.78rem;font-weight:800;white-space:nowrap;color:var(--ink);text-shadow:0 1px 5px rgba(0,0,0,.9);}
  .party-hp .hp-fill{background:linear-gradient(90deg,#57d95e,#b6f09a);}
  .party-row{display:flex;gap:.35rem;padding:2.15rem .6rem 0;align-items:flex-end;}
  .member{flex:1;position:relative;text-align:center;background:none;border:none;padding:0;min-height:0;}
  .member .art{height:56px;display:flex;align-items:flex-end;justify-content:center;border-radius:12px;}
  .member .art svg{height:56px;width:auto;max-width:100%;}
  .member .charge{height:6px;border-radius:99px;background:#0d0b22;margin-top:.2rem;overflow:hidden;border:1px solid var(--line);}
  .member .charge i{display:block;height:100%;background:var(--gold);transition:width .3s;}
  .member.ready .art{animation:pulse 1s infinite alternate;}
  @keyframes pulse{from{filter:drop-shadow(0 0 0 rgba(255,211,77,0));}to{filter:drop-shadow(0 0 7px rgba(255,211,77,.95));}}
  .member .acc{position:absolute;top:-2.05rem;left:50%;transform:translateX(-50%);z-index:8;
    font-family:"Arial Black","Hiragino Maru Gothic ProN",sans-serif;font-size:1.65rem;font-weight:900;line-height:1;
    letter-spacing:.02em;white-space:nowrap;opacity:0;transition:opacity .15s;
    -webkit-text-stroke:2px #1a0f00;paint-order:stroke fill;
    text-shadow:0 0 0 #000,3px 0 0 rgba(0,0,0,.9),-3px 0 0 rgba(0,0,0,.9),0 3px 0 rgba(0,0,0,.9),0 -3px 0 rgba(0,0,0,.9),3px 3px 0 rgba(0,0,0,.9),-3px 3px 0 rgba(0,0,0,.9),3px -3px 0 rgba(0,0,0,.9),-3px -3px 0 rgba(0,0,0,.9),0 4px 10px rgba(0,0,0,.8);}
  .member .acc.show{opacity:1;}
  .acc.fire{color:#ff3b2f;} .acc.water{color:#29b6ff;} .acc.forest{color:#39e75f;}
  .member .acc.counting{animation:accbounce .3s ease-in-out infinite;}
  @keyframes accbounce{
    0%{transform:translateX(-50%) translateY(0) scale(1);}
    30%{transform:translateX(-50%) translateY(-7px) scale(1.3);}
    55%{transform:translateX(-50%) translateY(0) scale(.93);}
    76%{transform:translateX(-50%) translateY(-3px) scale(1.15);}
    100%{transform:translateX(-50%) translateY(0) scale(1);}
  }
  #comboLayer{position:absolute;pointer-events:none;z-index:6;}
  .combo-tag{position:absolute;transform:translate(-50%,-50%);font-size:.82rem;font-weight:900;letter-spacing:.05em;
    background:linear-gradient(90deg,#ff5a4e,#ffb35c,#ffd34d,#3ecf6e,#3fa9f5,#c07fe8,#ff5a4e);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;pointer-events:none;animation:ctag .25s ease-out,rainbowblink .55s linear infinite;}
  @keyframes ctag{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}60%{opacity:1;transform:translate(-50%,-50%) scale(1.18);}100%{opacity:1;transform:translate(-50%,-50%) scale(1);}}
  /* パズドラ風：虹色が流れながら明滅する */
  @keyframes rainbowblink{
    0%{background-position:0% 50%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 3px rgba(0,0,0,.65)) brightness(1);}
    50%{background-position:110% 50%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 7px rgba(255,255,255,.55)) brightness(1.6);}
    100%{background-position:220% 50%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 3px rgba(0,0,0,.65)) brightness(1);}
  }
  .combo-tag.vanish{animation:ctagout .95s ease-out forwards,rainbowblink .55s linear infinite;}
  @keyframes ctagout{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}55%{opacity:.85;transform:translate(-50%,-56%) scale(1.32);}100%{opacity:0;transform:translate(-50%,-66%) scale(1.55);}}
  .member .acc.bump{animation:none;}
  .fx{position:absolute;left:50%;top:46%;width:0;height:0;pointer-events:none;z-index:9;}
  .fx i{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;opacity:0;animation:fxburst .78s cubic-bezier(.12,.7,.3,1) forwards;}
  .fx i svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,120,30,.95));}
  .fx .ring{position:absolute;left:0;top:0;width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;border:7px solid;opacity:0;animation:fxring .62s ease-out forwards;}
  .fx .ring2{position:absolute;left:0;top:0;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:5px solid rgba(255,255,255,.95);opacity:0;animation:fxring .48s ease-out .06s forwards;}
  .fx .core{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;opacity:0;animation:fxcore .58s ease-out forwards;}
  .fx .flash{position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;opacity:0;animation:fxflash .5s ease-out forwards;}
  .fx .pillar{position:absolute;left:0;bottom:-10px;width:54px;height:150px;margin-left:-27px;border-radius:50% 50% 18% 18%;opacity:0;transform-origin:50% 100%;animation:fxpillar .68s ease-out forwards;}
  @keyframes fxburst{0%{opacity:0;transform:translate(0,10px) scale(.25) rotate(0deg);}18%{opacity:1;}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.7) rotate(var(--rot));}}
  @keyframes fxring{0%{opacity:.95;transform:scale(.18);}100%{opacity:0;transform:scale(1.45);}}
  @keyframes fxcore{0%{opacity:0;transform:scale(.2);}22%{opacity:1;transform:scale(1.18);}55%{opacity:.95;transform:scale(1);}100%{opacity:0;transform:scale(1.55);}}
  @keyframes fxflash{0%{opacity:.9;transform:scale(.35);}100%{opacity:0;transform:scale(1.25);}}
  @keyframes fxpillar{0%{opacity:0;transform:scaleY(.2) scaleX(.6) translateY(20px);}28%{opacity:1;transform:scaleY(1.15) scaleX(1);}100%{opacity:0;transform:scaleY(1.35) scaleX(.7) translateY(-18px);}}
  .enemy-hit{animation:enemyhit .55s ease-out !important;}
  @keyframes enemyhit{0%{transform:translateX(0) scale(1);}12%{transform:translateX(-10px) scale(1.06) rotate(-2deg);}28%{transform:translateX(10px) scale(.96);}45%{transform:translateX(-7px);}62%{transform:translateX(6px);}100%{transform:translateX(0) scale(1);}}
  .dmg-pop{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-family:"Arial Black",sans-serif;font-size:2.6rem;font-weight:900;color:#fff;letter-spacing:.02em;
    -webkit-text-stroke:2px #200a00;text-shadow:0 0 14px rgba(255,90,20,.95),0 0 28px rgba(255,60,0,.7),3px 3px 0 #000,-2px 2px 0 #000,0 5px 0 rgba(0,0,0,.85);pointer-events:none;z-index:10;animation:dmgpop .95s ease-out forwards;}
  @keyframes dmgpop{0%{opacity:0;transform:translate(-50%,-20%) scale(.4) rotate(-3deg);}22%{opacity:1;transform:translate(-50%,-58%) scale(1.35) rotate(2deg);}42%{transform:translate(-50%,-62%) scale(1);}100%{opacity:0;transform:translate(-50%,-125%) scale(1.05);}}
  .board-wrap{position:relative;display:flex;justify-content:center;padding:.45rem .5rem .5rem;flex:0 1 auto;min-height:0;}
  /* JS（fitBoard）が効く前でも画面幅に収まる既定サイズを持たせる */
  #board{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:rgba(13,11,34,.88);
    border:1px solid var(--line);border-radius:14px;padding:5px;width:min(94vw,560px);aspect-ratio:1/1;max-width:100%;}
  /* 背の低い画面（iPhone 7 / SEなど）では敵と仲間を少し詰めて盤面の場所を確保する */
  @media (max-height:700px){
    .enemy-stage{min-height:70px;}
    .member .art{height:46px;}
    .member .art svg{height:46px;}
    .member .art img{height:46px;}
    .party-row{padding-top:1.85rem;}
    .enemy-name{font-size:.95rem;margin:.05rem 0 .2rem;}
  }
  .orb{aspect-ratio:1;border-radius:50%;border:none;padding:0;position:relative;min-height:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;transition:transform .12s, box-shadow .12s;}
  .orb svg{width:78%;height:78%;pointer-events:none;position:relative;z-index:1;filter:drop-shadow(0 0 3px rgba(255,255,255,.35)) drop-shadow(0 1px 1px rgba(0,0,0,.30));}
  /* パズドラ風のツヤ玉：本体は濃く鮮やかな色ガラスのまま、左上に
     芯のある強い面光沢、縁に明るいリムライト、下部に床からの
     反射光を入れて「磨かれた球」の立体感を出す */
  .orb::before{content:"";position:absolute;left:14%;top:5%;width:42%;height:28%;border-radius:50%;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 42% 40%,#ffffff 0%,rgba(255,255,255,.94) 26%,rgba(255,255,255,.40) 55%,rgba(255,255,255,0) 78%);
    transform:rotate(-18deg);}
  .orb::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 7px 9px rgba(255,255,255,.50),inset 0 -13px 15px -5px rgba(255,255,255,.55),inset 0 -9px 13px rgba(0,0,0,.20),inset 6px 0 10px rgba(255,255,255,.20),inset -6px 0 11px rgba(0,0,0,.15);}
  .orb.fire{background:radial-gradient(circle at 33% 26%,#ffc46b 0%,#ff8f4d 26%,#ff5f2e 55%,#f0331a 82%,#cd1f06 100%);}
  .orb.water{background:radial-gradient(circle at 33% 26%,#a5e3ff 0%,#5cc0ff 26%,#2b9bf5 55%,#0f7fe0 82%,#0a63bd 100%);}
  .orb.forest{background:radial-gradient(circle at 33% 26%,#b2ffc0 0%,#6df08c 26%,#2fd95c 55%,#12b845 82%,#0a9434 100%);}
  .orb.heal{background:radial-gradient(circle at 33% 26%,#ffc7e3 0%,#ff96c6 26%,#ff6aab 55%,#f74c97 82%,#e0337f 100%);}
  .orb.sel{box-shadow:0 0 0 3px #fff,0 0 14px rgba(255,255,255,.8);transform:scale(1.1);z-index:2;}
  .orb.clearing{animation:clr .3s forwards;}
  @keyframes clr{to{transform:scale(.2);opacity:0;}}
  .orb.changed{animation:chg .4s;}
  @keyframes chg{0%{transform:scale(.4) rotate(-30deg);}100%{transform:scale(1) rotate(0);}}
  .shake{animation:shk .35s;}
  @keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  /* モーダル */
  .overlay{position:fixed;inset:0;background:rgba(8,6,24,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:1rem;}
  .sheet{background:var(--panel2);border:1px solid var(--line);border-radius:20px;max-width:420px;width:100%;
    padding:1rem;text-align:center;max-height:88vh;max-height:88dvh;overflow:auto;}
  .sheet .art{height:110px;display:flex;align-items:flex-end;justify-content:center;}
  .sheet .art svg{height:110px;}
  .sheet h2{margin:.3rem 0 .2rem;font-size:1.15rem;}
  .sheet p{font-size:.88rem;line-height:1.55;color:var(--ink);margin:.35rem 0;}
  .sheet .sub{color:var(--sub);font-size:.78rem;}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:.7rem;font-size:1rem;font-weight:800;margin-top:.55rem;}
  .btn.primary{background:var(--gold);color:#3a2c00;}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.4;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
</head>
<body>

<!-- ============ ホーム ============ -->
<div id="home">
  <div class="topbar">
    <span style="flex:1"></span>
    <button class="icon-btn" id="bgmBtn">🎵 おんがく OFF</button>
    <button class="icon-btn on" id="seBtn">🔔 おと ON</button>
  </div>
  <div class="wrap">
    <h1>ゆいとはるかのパズルゲーム</h1>

    <div class="sec-title">ステージを えらんでね</div>
    <div class="stages" id="stageGrid"></div>
    <p class="hint">ぞくせいの さんすくみ：<b style="color:var(--fire)">ひ</b> は <b style="color:var(--forest)">もり</b>に、<b style="color:var(--forest)">もり</b> は <b style="color:var(--water)">みず</b>に、<b style="color:var(--water)">みず</b> は <b style="color:var(--fire)">ひ</b>に つよいよ。<br>なかまにした キャラが つよく たたかえる ステージが、つぎに 待っているよ！</p>

    <div class="sec-title">パーティ（5にんまで）― タップで 入れかえ</div>
    <div class="char-grid" id="partyGrid"></div>
    <p class="msg" id="homeMsg"></p>

function tone(f,t0,d,type,g){ if(!seOn&&type!=="bgm")return; const c=ac(),o=c.createOscillator(),v=c.createGain();
  o.type=type==="bgm"?"triangle":"sine"; o.frequency.value=f; o.connect(v); v.connect(c.destination);
  const s=c.currentTime+t0; v.gain.setValueAtTime(0,s); v.gain.linearRampToValueAtTime(g||.62,s+.015); v.gain.exponentialRampToValueAtTime(.001,s+d);
  o.start(s); o.stop(s+d+.05); }
function comboSE(combo){ const base=520*Math.pow(1.122,Math.min(combo-1,10)); tone(base,0,.14); tone(base*1.5,.05,.16); }
function whooshSE(combo){ if(!seOn)return; const c=ac(); const len=Math.floor(c.sampleRate*0.52);
  const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;

  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.95,t+.07); g.gain.exponentialRampToValueAtTime(.001,t+.52);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t); src.stop(t+.54); }

/* ---- BGM: パズドラ系ダンジョンBGMの文法で書いたオリジナル曲（全面作り直し） ----
   前版の反省：冒頭から8分音符の同じリズムで短い音を並べていたため
   「鍵盤を適当に叩いて切っている」ように聞こえた。新版は16分音符
   グリッドで旋律を書き直し、付点・休符・シンコペーション・長い
   伸ばしを混ぜて「歌う」旋律にした。構成は イントロ4小節→
   Aメロ8小節→Bメロ8小節→サビ8小節＝28小節（約45秒）で、
   ループ時はイントロを飛ばしてAメロに戻る。イントロはパッドと
   ティンパニのうねり＋金管の呼びかけだけ（刻みは入れない）、
   Aメロは問い→答えのフレーズ対、Bメロは細かいリズムで助走、
   サビは高音域で長く伸ばす。リードの長い音にはビブラートを
   かけて伸ばしを生かす。148 BPM。ステージで移調、ボスは厚め。 */
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
let _noiseBuf=null;
function noiseBuf(c){ if(_noiseBuf)return _noiseBuf; const len=Math.floor(c.sampleRate*0.5);
  const buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1; _noiseBuf=buf; return buf; }
function bgmOsc(freq,dur,vol,type,attack){ if(!bgmOn)return; const c=ac(),o=c.createOscillator(),v=c.createGain();
  o.type=type||"triangle"; o.frequency.value=freq; o.connect(v); v.connect(c.destination);
  const t=c.currentTime; v.gain.setValueAtTime(0,t);
  v.gain.linearRampToValueAtTime(vol,t+(attack||0.012));
  v.gain.exponentialRampToValueAtTime(.0008,t+dur); o.start(t); o.stop(t+dur+.05); }
function drumKick(){ if(!bgmOn)return; const c=ac(),o=c.createOscillator(),v=c.createGain(),t=c.currentTime;
  o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+.11);
  v.gain.setValueAtTime(.26,t); v.gain.exponentialRampToValueAtTime(.001,t+.18);
  o.connect(v); v.connect(c.destination); o.start(t); o.stop(t+.2); }

  s.buffer=noiseBuf(c); const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=7800;
  const v=c.createGain(), dur=open?.14:.045;
  v.gain.setValueAtTime(open?.05:.07,t); v.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(v); v.connect(c.destination); s.start(t); s.stop(t+dur+.02); }
function drumSnare(){ if(!bgmOn)return; const c=ac(),t=c.currentTime;
  const s=c.createBufferSource(); s.buffer=noiseBuf(c);
  const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1900; f.Q.value=.9;
  const v=c.createGain(); v.gain.setValueAtTime(.12,t); v.gain.exponentialRampToValueAtTime(.001,t+.13);
  s.connect(f); f.connect(v); v.connect(c.destination); s.start(t); s.stop(t+.15);
  const o=c.createOscillator(),ov=c.createGain(); o.type="triangle"; o.frequency.value=196;
  ov.gain.setValueAtTime(.06,t); ov.gain.exponentialRampToValueAtTime(.001,t+.08);

  const v=c.createGain(); v.gain.setValueAtTime(.11,t); v.gain.exponentialRampToValueAtTime(.001,t+.7);

  o.type="sine"; o.frequency.setValueAtTime(mtof(midi),t); o.frequency.exponentialRampToValueAtTime(mtof(midi)*.55,t+.14);
  v.gain.setValueAtTime(.13,t); v.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(v); v.connect(c.destination); o.start(t); o.stop(t+.22); }
function bgmLead(midi,dur,vol){ if(!bgmOn)return; const c=ac(),t=c.currentTime;
  /* 金管（ホルン／トランペット）風リード：わずかにデチューンした鋸波2本＋
     三角波をローパスで丸め、立ち上がりを少し遅くして吹奏感を出す。

function newBoard(){ let b; do{ b=Array.from({length:N*N},()=>TYPES[Math.floor(Math.random()*4)]); }while(findGroups(b).length); return b; }
function findGroups(b){
  const groups=[], seen=new Set();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const t=b[r*N+c]; if(!t)continue;
    for(const [dr,dc] of [[0,1],[1,0]]){
      const cells=[[r,c]]; let rr=r+dr,cc=c+dc;
      while(rr<N&&cc<N&&b[rr*N+cc]===t){cells.push([rr,cc]);rr+=dr;cc+=dc;}
      if(cells.length>=3){ const key=cells.map(x=>x[0]*N+x[1]).sort().join(",");
        if(!seen.has(key)){seen.add(key);groups.push({type:t,cells:cells.map(x=>x[0]*N+x[1])});} }
    }
  }
  // 重なり合うグループを統合
  const merged=[];
  groups.forEach(g=>{ const hit=merged.find(m=>m.type===g.type&&m.cells.some(x=>g.cells.includes(x)));
    if(hit){ g.cells.forEach(x=>{if(!hit.cells.includes(x))hit.cells.push(x);}); } else merged.push({type:g.type,cells:[...g.cells]}); });
  return merged;
}

/* コンボ倍率：コンボが進むほど加速して伸びるカーブ（爽快感重視）。
   前回よりさらに引き上げ：1コンボ×1.0 → 3コンボ×2.64 → 5コンボ×5.56

function comboMult(n){ const k=Math.max(0,n-1); return 1 + 0.50*k + 0.16*k*k; }
async function resolveBoard(){

  B.accRaw=B.accRaw.map(()=>0);
  while(true){
    const groups=findGroups(B.board);
    if(!groups.length)break;
    for(const g of groups){
      combo++;
      comboSE(combo);
      tags.push(showComboTag(g, combo));
      // 攻撃の蓄積（この段階ではコンボ倍率なしの初期値をキャラに表示）
      if(g.type==="heal"){
        const bonus=save().party.some(id=>{const c=charById(id);return c.passive.includes("かいふく");})?1.5:1;
        B.partyHp=Math.min(PARTY_HP, B.partyHp + g.cells.length*4*bonus*comboMult(combo));
      } else {
        save().party.forEach((id,idx)=>{
          const c=charById(id); if(c.attr!==g.type)return;
          const pb=c.passive.includes("+35")?1.35:c.passive.includes("+25")?1.25:1.1;
          const raw=c.atk * g.cells.length * 0.34 * pb;
          B.accRaw[idx]+=raw;
          B.acc[idx]+=raw * comboMult(combo);
        });
        B.accDisp=B.accRaw.slice(); // 初期値（倍率なし）を表示
      }
      renderBattle();
      const bd=$("board").children;
      g.cells.forEach(ci=>{ if(bd[ci])bd[ci].classList.add("clearing"); });
      await wait(300);
      g.cells.forEach(ci=>B.board[ci]=null);
      dropOrbs(); renderBoard();
      await wait(130);
    }
  }
  // コンボ終了：コンボ表示が1から順にシュンシュンと消えて、
  // そのたびに攻撃値がコンボ倍率ぶんバウンドしながら増えていく
  const totalBonus=B.acc.map((v,i)=>v-B.accRaw[i]);
  if(tags.length){
    await wait(440);
    for(let k=1;k<=tags.length;k++){
      if(!B)return;
      whooshSE(k);
      const tag=tags[k-1];
      if(tag){ tag.classList.add("vanish"); setTimeout(()=>tag.remove(),980); }
      const targets=B.accRaw.map((raw,i)=>raw + totalBonus[i]*(k/tags.length));
      bumpAccLabels(targets);
      await tweenAcc(targets,420);
      await wait(120);
    }
    B.accDisp=B.acc.slice(); updateAccLabels();
  }
  if(!B)return;
  // 全てのコンボの加算が終わったら、まとめて攻撃（属性ごとのエフェクト）
  const total=B.acc.reduce((a,b)=>a+b,0);
  if(total>0){
    await wait(150);

    const attackers=[];

    for(let j=0;j<attackers.length;j++){
      attackEffect(attackers[j]);
      if(j<attackers.length-1) await wait(280);

    B.enemyHp-=dmg;

    await wait(200);
  }

}

let accAnim=null, accTimer=null;
function tweenAcc(to, dur){
  return new Promise(res=>{
    if(!B){res();return;}
    if(accAnim)cancelAnimationFrame(accAnim);
    if(accTimer){clearInterval(accTimer);accTimer=null;}
    const target=to.map(v=>Math.round(v));
    const start=B.accDisp.map(v=>Math.round(v));
    B.accDisp=start.slice(); updateAccLabels();
    if(start.every((v,i)=>v>=target[i])){ document.querySelectorAll(".member .acc").forEach(el=>el.classList.remove("counting")); res(); return; }
    /* カウントアップは「値の大きさ」ではなく「時間」で終わらせる。
       旧実装は1ずつ（最大でも毎秒約125）しか進まなかったため、
       コンボ倍率で攻撃値が大きくなるほど1コンボ分の計算時間が
       値に比例して伸びていた。ここでは dur ミリ秒で必ず目標値に
       到達するよう、経過時間の割合（イーズアウト）で表示値を

      }

  });
}

function boomSE(attr){

    const o=c.createOscillator(), og=c.createGain();

    const g=c.createGain(); g.gain.setValueAtTime(attr==="fire"?1.0:.78,t); g.gain.exponentialRampToValueAtTime(.001,t+.42);

    for(let p=-1;p<=1;p++) html+='<span class="pillar" style="left:'+(p*52)+'px;background:linear-gradient(to top,#ff3b2f,#ff8a3c 55%,#ffd34d);animation-delay:'+(Math.abs(p)*0.05)+'s"></span>';
  }
  if(attr==="water"){
    html+='<span class="pillar" style="background:linear-gradient(to top,#1668ad,#3fa9f5 55%,#bfe6ff);width:72px;margin-left:-36px"></span>';
  }
  if(attr==="forest"){
    html+='<span class="pillar" style="background:linear-gradient(to top,#1d8f43,#57d95e 55%,#d6ffd0);width:64px;margin-left:-32px"></span>';
  }
  const Np=16;
  for(let i=0;i<Np;i++){
    const ang=(Math.PI*2*i/Np)+Math.random()*.6, dist=62+Math.random()*78;
    const dx=Math.round(Math.cos(ang)*dist), dy=Math.round(Math.sin(ang)*dist*.85)-18;
    const rot=Math.round((Math.random()*260-130))+"deg";
    const sz=attr==="fire"? (34+Math.random()*22) : (28+Math.random()*18);
    html+='<i style="--dx:'+dx+'px;--dy:'+dy+'px;--rot:'+rot+';width:'+sz+'px;height:'+sz+'px;margin:'+(-sz/2)+'px 0 0 '+(-sz/2)+'px;animation-delay:'+(i*0.018)+'s">'+FX_ICON[attr]+'</i>';
  }
  /* 星屑スパーク */
  for(let i=0;i<8;i++){
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*95;
    const dx=Math.round(Math.cos(ang)*dist), dy=Math.round(Math.sin(ang)*dist)-10;
    html+='<i style="--dx:'+dx+'px;--dy:'+dy+'px;--rot:45deg;width:16px;height:16px;margin:-8px 0 0 -8px;animation-delay:'+(0.05+i*0.02)+'s"><svg viewBox="0 0 24 24"><path d="M12 1 L14.5 9.5 L23 12 L14.5 14.5 L12 23 L9.5 14.5 L1 12 L9.5 9.5Z" fill="#fff6b0"/></svg></i>';
  }
  fx.innerHTML=html;
  stage.appendChild(fx);
  const ea=$("enemyArt");
  if(ea){ ea.classList.remove("enemy-hit"); void ea.offsetWidth; ea.classList.add("enemy-hit"); }
  const stg=$("enemyStage"); if(stg){ stg.classList.remove("shake"); void stg.offsetWidth; stg.classList.add("shake"); }
  setTimeout(()=>fx.remove(),950);
}
function showDmgPop(dmg){
  const stage=$("enemyStage"); if(!stage)return;
  const el=document.createElement("div");
  el.className="dmg-pop"; el.textContent="-"+Math.round(dmg);
  stage.appendChild(el);
  setTimeout(()=>el.remove(),980);
}
function dropOrbs(){
  for(let c=0;c<N;c++){
    const col=[];
    for(let r=N-1;r>=0;r--) if(B.board[r*N+c])col.push(B.board[r*N+c]);
    for(let r=N-1;r>=0;r--) B.board[r*N+c]=col[N-1-r]||TYPES[Math.floor(Math.random()*4)];
  }
}
function endTurn(){
  if(!B||B.over)return;
  save().party.forEach((id,i)=>{ const c=charById(id); B.charges[i]=Math.min(c.skill.turns,B.charges[i]+1); });
  B.cd--;
  if(B.cd<=0){
    B.partyHp-=B.stage.atk; B.cd=B.stage.cd;
    const pr=$("partyRow"); pr.classList.remove("shake"); void pr.offsetWidth; pr.classList.add("shake");
    if(B.partyHp<=0){ B.partyHp=0; renderBattle(); loseBattle(); B.busy=false; return; }
  }
  B.busy=false; renderBattle();
}
function tapMember(i){
  if(!B||B.busy||B.over)return;
  const c=charById(save().party[i]);
  if(B.charges[i]<c.skill.turns)return;
  useSkill(i);
}
function useSkill(i){
  const c=charById(save().party[i]), sk=c.skill;
  if(sk.type==="change"){
    const count=B.board.filter(t=>t===sk.from).length;
    if(count===0){ showSheet('<h2>つかえないよ</h2><p>'+(sk.from==="fire"?"あか":sk.from==="water"?"あお":"みどり")+'オーブが 盤面に ないよ。<br>スキルは そのまま たまっているよ。</p><button class="btn primary" onclick="closeSheet()">とじる</button>'); return; }
    B.charges[i]=0; skillSE();
    const changed=[];
    B.board=B.board.map((t,idx)=>{ if(t===sk.from){changed.push(idx);return sk.to;} return t; });
    renderBoard(changed); renderBattle();
    showSheet('<h2>'+sk.name+'</h2><p>オーブの いろが かわったよ！<br>つぎの 入れかえで コンボが はじまるよ。</p><button class="btn primary" onclick="closeSheet()">とじる</button>');
    return;
  }
  B.charges[i]=0; skillSE();
  if(sk.type==="dmg"||sk.type==="dmgheal"){
    /* スキル攻撃もオーブ攻撃と同じく「キャラ自身の属性」で攻撃する：
       属性相性を適用し、自分の属性のエフェクトとダメージ表示を出す。
       以前は属性なしの固定ダメージで、攻撃の属性が見えなかった */
    const m=(ATTR_MULT[c.attr]&&ATTR_MULT[c.attr][B.enemy.attr])||1;
    const dmg=Math.round(sk.power*m);
    B.enemyHp-=dmg;
    attackEffect(c.attr);
    showDmgPop(dmg);
  }
  if(sk.type==="heal"){ B.partyHp=Math.min(PARTY_HP,B.partyHp+sk.power); }
  if(sk.type==="dmgheal"&&sk.heal){ B.partyHp=Math.min(PARTY_HP,B.partyHp+sk.heal); }
  renderBattle();
  if(B.enemyHp<=0) winBattle();
}
function showSkillPanel(i){
  if(!B)return;
  const c=charById(save().party[i]), ready=B.charges[i]>=c.skill.turns;
  showSheet('<div class="art">'+c.art()+'</div><h2>'+c.name+'</h2><div>'+starHTML(c)+'</div>'+
   '<p><span class="tag '+c.attr+'">'+ATTR[c.attr].name+'</span> こうげき '+c.atk+'</p>'+
   '<p>いつもスキル：'+c.passive+'</p>'+
   '<p><b>タップスキル「'+c.skill.name+'」</b><br>'+c.skill.desc+'<br><span class="sub">'+c.skill.turns+'ターンで たまる（いま '+B.charges[i]+'）</span></p>'+
   '<button class="btn primary" id="useSkillBtn" '+(ready?"":"disabled")+'>スキルを つかう</button>'+
   '<button class="btn ghost" onclick="closeSheet()">とじる</button>');
  const b=$("useSkillBtn"); if(b)b.onclick=()=>{ closeSheet(); if(!B.busy&&!B.over)useSkill(i); };
}
function winBattle(){
  if(!B||B.over)return; B.over=true; winSE();
  const s=save(), st=B.stage;
  if(!s.cleared.includes(st.n))s.cleared.push(st.n);
  const ec=charById(st.enemy);
  let recruitMsg="";
  if(!s.owned.includes(ec.id)){
    if(Math.random()<st.recruit){ s.owned.push(ec.id); recruitMsg='<p>🎉 <b>'+ec.name+'</b> が なかまに なったよ！</p>'; }
    else recruitMsg='<p class="sub">'+ec.name+' は なかまに ならなかった…また たたかってみよう。</p>';
  }
  showSheet('<h2>🎉 クリア！</h2><p>ステージ '+st.n+' の '+ec.name+' を たおしたよ！</p>'+recruitMsg+
   '<button class="btn primary" onclick="backHome()">ホームへ もどる</button>');
}
function loseBattle(){
  if(!B||B.over)return; B.over=true;
  showSheet('<h2>💦 まけちゃった…</h2><p>パーティを つよくして、もう一度 チャレンジしよう！<br>なかまを あつめると つよくなれるよ。</p><button class="btn primary" onclick="backHome()">ホームへ もどる</button>');
}
function showSheet(html){ $("sheet").innerHTML=html; $("overlay").classList.remove("hidden"); }
function closeSheet(){ $("overlay").classList.add("hidden"); }
function backHome(){ closeSheet(); B=null; $("battle").classList.add("hidden"); $("home").classList.remove("hidden"); renderHome(); }
$("quitBtn").onclick=backHome;
$("overlay").addEventListener("click",e=>{ if(e.target===$("overlay"))closeSheet(); });
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

renderHome();
</script>
<script>
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch(e) {} }
try {
  var raw = localStorage.getItem('yuiharuka-puzzle-save-v2');
  if (raw) { var p = JSON.parse(raw); if (p) { for (var k in p) { if (Object.prototype.hasOwnProperty.call(p, k)) save[k] = p[k]; } } }
  var persist = function(){ try { localStorage.setItem('yuiharuka-puzzle-save-v2', JSON.stringify(save)); } catch(e) {} };
  persist();
  setInterval(persist, 1000);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') persist(); });
  addEventListener('beforeunload', persist);
} catch(e) {}
</script>
</body>
</html>
